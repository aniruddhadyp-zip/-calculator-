<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jungle Calculator</title>
   <style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(
            135deg,
            #0b2e13,
            #145a24,
            #071d0c
        );
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        overflow: hidden;
    }

    #calculator {
        width: 330px;
        padding: 20px;
        background: rgba(0, 30, 10, 0.85);
        border: 2px solid #3c8f45;
        border-radius: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 80, 0.25);
    
        z-index: 5;
        position: relative;
       }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    #display {
        width: 100%;
        height: 65px;
        box-sizing: border-box;
        margin-bottom: 15px;
        border: none;
        border-radius: 12px;
        font-size: 28px;
        text-align: right;
        padding: 10px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        height: 60px;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        cursor: pointer;
        background: #d8ead8;
    }

    button:active {
        transform: scale(0.95);
    }

     .jungle {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.tree {
    position: absolute;
    font-size: 80px;
    opacity: 0.6;
}

.tree1 {
    left: 5%;
    bottom: 5%;
}

.tree2 {
    right: 5%;
    bottom: 5%;
}

.tree3 {
    left: 15%;
    top: 5%;
}

.tree4 {
    right: 15%;
    top: 8%;
}

.bird {
    position: fixed;
    font-size: 35px;
    z-index: 2;
    pointer-events: none;
}

.bird1 {
    top: 15%;
    left: -60px;
    animation: fly1 12s linear infinite;
}

.bird2 {
    top: 35%;
    left: -60px;
    animation: fly2 16s linear infinite;
}

.bird3 {
    top: 60%;
    left: -60px;
    animation: fly3 20s linear infinite;
}

@keyframes fly1 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}

@keyframes fly2 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}

@keyframes fly3 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}
</style>

</head>

<body>

    <h1>🌿 Jungle Calculator</h1>

    <button id="soundButton"                   onclick="toggleSound()">
    🔊 Jungle Sound
</button>

<audio id="jungleSound" loop>
    <source src="jungle.mp3" type="audio/mpeg">
</audio>
    
        
        <div id="calculator">
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button>C</button>
            <button>DEL</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>
    
 <div class="jungle">
    <div class="tree tree1">🌴</div>
    <div class="tree tree2">🌳</div>
    <div class="tree tree3">🌴</div>
    <div class="tree tree4">🌳</div>
</div>

<div class="bird bird1">🦜</div>
<div class="bird bird2">🐦</div>
<div class="bird bird3">🦜</div>

</body>
</html>
