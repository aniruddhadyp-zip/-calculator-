<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jungle Calculator</title>
   <style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(
            135deg,
            #0b2e13,
            #145a24,
            #071d0c
        );
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        overflow: hidden;
    }

    #calculator {
        width: 330px;
        padding: 20px;
        background: rgba(0, 30, 10, 0.85);
        border: 2px solid #3c8f45;
        border-radius: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 80, 0.25);
    
        z-index: 5;
        position: relative;
       }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    #display {
        width: 100%;
        height: 65px;
        box-sizing: border-box;
        margin-bottom: 15px;
        border: none;
        border-radius: 12px;
        font-size: 28px;
        text-align: right;
        padding: 10px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        height: 60px;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        cursor: pointer;
        background: #d8ead8;
    }

    button:active {
        transform: scale(0.95);
    }

     .jungle {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.tree {
    position: absolute;
    font-size: 80px;
    opacity: 0.6;
}

.tree1 {
    left: 5%;
    bottom: 5%;
}

.tree2 {
    right: 5%;
    bottom: 5%;
}

.tree3 {
    left: 15%;
    top: 5%;
}

.tree4 {
    right: 15%;
    top: 8%;
}

.bird {
    position: fixed;
    font-size: 35px;
    z-index: 2;
    pointer-events: none;
}

.bird1 {
    top: 15%;
    left: -60px;
    animation: fly1 12s linear infinite;
}

.bird2 {
    top: 35%;
    left: -60px;
    animation: fly2 16s linear infinite;
}

.bird3 {
    top: 60%;
    left: -60px;
    animation: fly3 20s linear infinite;
}

@keyframes fly1 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}

@keyframes fly2 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}

@keyframes fly3 {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(110vw);
    }
}
</style>

</head>

<body>

    <h1>🌿 Jungle Calculator</h1>

    <button id="soundButton"                   onclick="toggleSound()">
    🔊 Jungle Sound
</button>

<audio id="jungleSound" loop>
    <source src="jungle.mp3" type="audio/mpeg">
</audio>
    
        
        <div id="calculator">
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button onclick="clearCalculator()">C</button>
            <button onclick="deleteNumber()">DEL</button>
            <button onclick="addNumber('%')">%</button>
            <button onclick="setOperator('/')">÷</button>

            <buttononclick="addNumber('7')">7</button>
            <buttononclick="addNumber('8')">8</button>
            <buttononclick="addNumber('9')">9</button>
            <buttononclick="setOperator('*')">×</button>

            <buttononclick="addNumber('4')">4</button>
            <buttononclick="addNumber('5')">5</button>
            <buttononclick="addNumber('6')">6</button>
            <buttononclick="setOperator('-')">−</button>

            <buttononclick="addNumber('1')">1</button>
            <buttononclick="addNumber('2')">2</button>
            <buttononclick="addNumber('3')">3</button>
            <buttononclick="setOperator('+')">+</button>

            <buttononclick="addNumber('0')">0</button>
            <buttononclick="addNumber('.')">.</button>
            <button   onclick="showResult()">=</button>
        </div>
    </div>
    
 <div class="jungle">
    <div class="tree tree1">🌴</div>
    <div class="tree tree2">🌳</div>
    <div class="tree tree3">🌴</div>
    <div class="tree tree4">🌳</div>
</div>

<div class="bird bird1">🦜</div>
<div class="bird bird2">🐦</div>
<div class="bird bird3">🦜</div>

<script>

function toggleSound() {
    const sound = document.getElementById("jungleSound");
    const button = document.getElementById("soundButton");

    if (sound.paused) {
        sound.play();
        button.innerText = "🔇 Jungle Sound OFF";
    } else {
        sound.pause();
        button.innerText = "🔊 Jungle Sound ON";
    }
}
let firstNumber = "";
let secondNumber = "";
let operator = "";
let newNumber = true;

function addNumber(number) {
    let display = document.getElementById("display");

    if (newNumber) {
        display.value = "";
        newNumber = false;
    }

    if (number === "." && display.value.includes(".")) {
        return;
    }

    if (number === "%") {
        display.value = Number(display.value) / 100;
        return;
    }

    display.value += number;
}

function setOperator(selectedOperator) {
    let display = document.getElementById("display");

    firstNumber = display.value;
    operator = selectedOperator;
    newNumber = true;
}

function showResult() {
    let display = document.getElementById("display");

    secondNumber = display.value;

    let num1 = Number(firstNumber);
    let num2 = Number(secondNumber);
    let result;

    if (operator === "+") {
        result = num1 + num2;
    }
    else if (operator === "-") {
        result = num1 - num2;
    }
    else if (operator === "*") {
        result = num1 * num2;
    }
    else if (operator === "/") {

        if (num2 === 0) {
            display.value = "Cannot divide by 0";
            return;
        }

        result = num1 / num2;
    }

    display.value = result;

    firstNumber = result;
    secondNumber = "";
    operator = "";
    newNumber = true;
}

function clearCalculator() {
    document.getElementById("display").value = "0";

    firstNumber = "";
    secondNumber = "";
    operator = "";
    newNumber = true;
}

function deleteNumber() {
    let display = document.getElementById("display");

    display.value = display.value.slice(0, -1);

    if (display.value === "") {
        display.value = "0";
    }
}
</script>
</body>
</html>
